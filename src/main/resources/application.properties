spring.application.name=bilim_scan
server.port=${SERVER_PORT:8080}
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/bilim_scan}
jwt.secret=${JWT_SECRET:dev-only-secret-key-change-in-prod-32}
jwt.expiration-ms=${JWT_EXPIRATION_MS:10800000}
bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}
